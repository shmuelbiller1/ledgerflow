# LedgerFlow: reuse the LCOV reports already generated by CI's four unit shards.
# Authentication is via GitHub Actions OIDC (SonarCloud secretless analysis);
# no personal SONAR_TOKEN is required. Automatic Analysis must be OFF.
# See docs/SONARCLOUD_COVERAGE.md for the one-time owner setup.
sonar.projectKey=shmuelbiller1_ledgerflow
sonar.organization=shmuelbiller1
sonar.host.url=https://sonarcloud.io
sonar.javascript.lcov.reportPaths=coverage/shard-1.lcov,coverage/shard-2.lcov,coverage/shard-3.lcov,coverage/shard-4.lcov
