# Archived files (old one-off scripts, audit runs, finished notes) are kept for history only;
# they are not part of the app, so they are not analysed.
sonar.exclusions=docs/archive/**,archive/**,audit/**
# the five sign-in emails share one layout on purpose (built from supabase/templates/src)
# Intentional duplication — repeated by design, not copy-paste bugs:
#   * bilingual translation / help content (EN/HE pairs repeat by design), including reportTranslationsMore2
#     and the four first-run tables (sign-in, wizard, Overview screens, chart-template names) added by
#     AI12-N10 plus errorRemediesCopy.ts from AI12-N3; a row is a key and its two sentences, so
#     consecutive rows are structurally identical to Sonar's CPD (which normalises literals) while
#     saying different things.
#   * SQL migrations (each migration is independent DDL with a similar structure)
#   * reference / template data (distinct data sets share a shape by design)
# Registered-command schemas are generated per command; their repeated JSON Schema structure is intentional.
sonar.cpd.exclusions=supabase/templates/**,src/lib/i18n/screenTranslations.ts,src/lib/i18n/onboardingTranslations.ts,src/lib/i18n/setupTranslations.ts,src/lib/i18n/overviewTranslations.ts,src/lib/i18n/onboardingTemplateCopy.ts,src/lib/errorRemediesCopy.ts,src/lib/i18n/reportTranslationsMore2.ts,src/config/screenHelpHe.ts,src/config/screenHelp.ts,src/lib/helpCenterArticles.ts,supabase/migrations/**,src/lib/businessTemplatesExtended.ts,src/lib/businessTemplatesCore.ts,src/lib/businessTemplatesIndustry.ts,src/lib/reportTotalExplanations.ts,src/lib/mainPathGuide.ts,src/config/screenShortcuts.ts,src/lib/commandSchemas.generated/**
# S2187 "Add some tests to this file" is a file-level finding with no line, so it cannot be
# suppressed with an inline // NOSONAR. These two files are real tests: they register their cases
# via the describeSaveFailures DSL in src/tests/helpers/failureHarness.ts, which Sonar's
# per-file scanner cannot see. Ignore S2187 on exactly these files instead.
sonar.issue.ignore.multicriteria=s2187books,s2187sales,s6845grid
sonar.issue.ignore.multicriteria.s2187books.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187books.resourceKey=src/tests/save-failures-books.test.tsx
sonar.issue.ignore.multicriteria.s2187sales.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187sales.resourceKey=src/tests/save-failures-sales.test.tsx
# S6845: the named scrollable table region deliberately accepts keyboard focus.
# Keep this exception limited to its shared grid file; all other Sonar rules still apply.
sonar.issue.ignore.multicriteria.s6845grid.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.s6845grid.resourceKey=src/components/ui/TanStackDataGrid.tsx
