# Archived files (old one-off scripts, audit runs, finished notes) are kept for history only;
# they are not part of the app, so they are not analysed.
sonar.exclusions=docs/archive/**,archive/**,audit/**
# the five sign-in emails share one layout on purpose (built from supabase/templates/src)
# Intentional duplication — repeated by design, not copy-paste bugs:
#   * bilingual translation / help content (EN/HE pairs repeat by design)
#   * SQL migrations (each migration is independent DDL with a similar structure)
#   * reference / template data (distinct data sets share a shape by design)
sonar.cpd.exclusions=supabase/templates/**,src/lib/i18n/screenTranslations.ts,src/config/screenHelpHe.ts,src/config/screenHelp.ts,src/lib/helpCenterArticles.ts,supabase/migrations/**,src/lib/businessTemplatesExtended.ts,src/lib/businessTemplatesCore.ts,src/lib/businessTemplatesIndustry.ts,src/lib/reportTotalExplanations.ts,src/lib/mainPathGuide.ts,src/config/screenShortcuts.ts
# S2187 "Add some tests to this file" is a file-level finding with no line, so it cannot be
# suppressed with an inline // NOSONAR. These two files are real tests: they register their cases
# via the describeSaveFailures DSL in src/tests/helpers/failureHarness.ts, which Sonar's
# per-file scanner cannot see. Ignore S2187 on exactly these files instead.
sonar.issue.ignore.multicriteria=s2187books,s2187sales
sonar.issue.ignore.multicriteria.s2187books.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187books.resourceKey=src/tests/save-failures-books.test.tsx
sonar.issue.ignore.multicriteria.s2187sales.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187sales.resourceKey=src/tests/save-failures-sales.test.tsx
