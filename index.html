<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://%BRAND_DOMAIN%/" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="keywords" content="finance, accounting, software, ledger, dimensional accounting, multi-entity, forecasting, audit" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%BRAND_NAME% | %BRAND_TAGLINE%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:image" content="/pwa-512x512.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="%BRAND_NAME% | %BRAND_TAGLINE%" />
    <meta property="twitter:description" content="%BRAND_DESCRIPTION%" />
    <meta property="twitter:image" content="/pwa-512x512.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <title>%BRAND_NAME% | %BRAND_TAGLINE%</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but this application doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
      <p>%BRAND_NAME% is bookkeeping for small businesses.</p>
    </noscript>
    <div id="root"></div>
    <script>
      window.addEventListener("error", (e) => {
        fetch("/api/health", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ error: e.message, stack: e.error ? e.error.stack : null, type: "error" }) }).catch(()=>{});
      });
      window.addEventListener("unhandledrejection", (e) => {
        fetch("/api/health", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ error: e.reason ? e.reason.message : "Promise Rejection", stack: e.reason ? e.reason.stack : null, type: "unhandledrejection" }) }).catch(()=>{});
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
