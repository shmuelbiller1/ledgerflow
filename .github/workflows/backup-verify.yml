name: Backup verification (S-19)

on:
  schedule:
    - cron: '23 4 * * *'   # 04:23 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-verify
  cancel-in-progress: false

jobs:
  verify-backups:
    name: Verify Supabase backup / PITR freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          HUSKY: '0'
      - name: Check Supabase Management API backup status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          MAX_BACKUP_AGE_HOURS: ${{ vars.MAX_BACKUP_AGE_HOURS || '26' }}
          REQUIRE_PITR: ${{ vars.REQUIRE_PITR || 'false' }}
          BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not configured; skipping live Supabase backup check. Set it in repository Secrets to enable S-19 enforcement."
          fi
          npx tsx scripts/verify-backups.ts --skip-if-unconfigured
