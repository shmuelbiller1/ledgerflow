name: Dependency SBOM evidence

# S-04, extracted from #254: one bounded, read-only inventory job.
# The existing CI already enforces npm audit; do not duplicate its workload.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.pull_request.number || github.ref }}
# Newer main and PR commits supersede these results; scan only the latest head.
  cancel-in-progress: true

jobs:
  dependency-sbom:
    name: Produce CycloneDX inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned lockfile dependencies
        run: npm ci --ignore-scripts
        env:
          HUSKY: '0'
          NODE_ENV: development
          npm_config_production: 'false'
      - name: Scan tracked source for accidental private keys or live secret tokens
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split('\n').filter(Boolean);
          const skip = /^(src\/tests\/|e2e\/|audit\/|docs\/|supabase-config\.json$)/;
          const patterns = [
            ['PEM private key', /-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----/],
            ['Stripe live secret or restricted key', /\b(?:sk|rk)_live_[0-9a-zA-Z]{24,}\b/],
            ['GitHub personal access token', /\b(?:ghp_[0-9a-zA-Z]{36,}|github_pat_[0-9a-zA-Z_]{80,})\b/],
            ['Supabase service-role or personal token', /\bsbp_[0-9a-f]{40,}\b/],
            ['Resend API key', /\bre_[0-9A-Za-z_]{24,}\b/],
            ['SendGrid API key', /\bSG\.[0-9A-Za-z_-]{20,}\.[0-9A-Za-z_-]{30,}\b/],
            ['Google / Gemini API key', /\bAIza[0-9A-Za-z_-]{35}\b/],
            ['Slack bot or user token', /\bxox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*\b/],
            ['AWS access key ID', /\b(?:AKIA|ASIA)[0-9A-Z]{16}\b/],
          ];
          const hits = [];
          for (const file of tracked) {
            if (skip.test(file) || !fs.existsSync(file) || fs.statSync(file).size > 2_000_000) continue;
            const text = fs.readFileSync(file, 'utf8');
            for (const [label, rx] of patterns) {
              if (rx.test(text)) hits.push(`${file}: ${label}`);
            }
          }
          if (hits.length) {
            console.error('Potential secret detected in tracked files:\n' + hits.join('\n'));
            process.exit(1);
          }
          NODE
      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format=cyclonedx > sbom.json
      - name: Check inventory and record license metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const document = JSON.parse(fs.readFileSync('sbom.json', 'utf8'));
          if (document.bomFormat !== 'CycloneDX' || !Array.isArray(document.components) || document.components.length === 0) {
            throw new Error('SBOM missing CycloneDX components');
          }
          const unknown = document.components.filter(item => !Array.isArray(item.licenses) || !item.licenses.length);
          const lines = [
            '# Dependency SBOM evidence',
            '',
            'Commit: ' + process.env.GITHUB_SHA,
            'Components: ' + document.components.length,
            'Components without supplied license metadata: ' + unknown.length,
            '',
            'This is dependency and license metadata inventory, **not** a legal compatibility certification.',
            'Unknown, dual-licensed and transitive packages require individual review.',
            '',
            '## Components missing license metadata',
            ...unknown.map(item => '- ' + String(item.name || 'unnamed').replace(/[\r\n]/g, ' ')),
            '',
          ];
          fs.writeFileSync('sbom-summary.md', lines.join('\n'));
          NODE
      - name: Save SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.json
            sbom-summary.md
          if-no-files-found: ignore
          retention-days: 30
