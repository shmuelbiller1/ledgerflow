name: Daily line count
permissions:
  contents: write
# Stopped by the owner (8 Nov): the daily commit to main made other branches out of date.
# Run it by hand from the Actions tab if a count is wanted.
on:
  workflow_dispatch:
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/line-count.sh
      - run: |
          git config user.name 'Line count (GitHub Actions)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LINE_COUNT.md
          git diff --cached --quiet || { git commit -m "docs: daily line count"; git pull --rebase origin main; git push origin HEAD:main; }
