name: Regenerate the visual snapshots (one-off)
# The Settings screen's pixels changed on purpose: sixteen screens went from two filled
# buttons to one (EASE_OF_USE U-2). The suite's tolerance is deliberately tight — 100
# pixels — so a deliberate change must replace the baseline rather than slip under it.
# Run from the Actions tab, or push to a branch named regen/visual-snapshots.
on:
  workflow_dispatch:
  push:
    branches: ['regen/visual-snapshots']

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres # NOSONAR: ephemeral CI test database password
          POSTGRES_DB: lf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'arena/4d381013-ledgerflow' || github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
        env: { NODE_ENV: development, npm_config_production: false, HUSKY: 0 }
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: npm run db:test-setup
      - name: Regenerate the Settings shots only
        run: npm run test:e2e -- visual-regression.spec.ts --grep "visual settings" --update-snapshots
      - name: Upload them
        uses: actions/upload-artifact@v4
        with:
          name: settings-snapshots
          path: e2e/__screenshots__/settings-*.png
