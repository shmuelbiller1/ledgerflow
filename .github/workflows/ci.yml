name: CI

# When CI runs (owner, 13 Oct: no double runs). The repository is public, so minutes are free, but
# double runs slow everyone down:
#  - a pull request runs it on the PR merged with the latest main (what will actually land);
#  - a push to main runs it once more on the real merged result;
#  - a push to a branch with no PR does NOT run it (helper AIs open a draft PR to get CI);
#  - by hand any time (Actions → CI → "Run workflow").
# Before this, every push to a helper branch with an open PR ran CI twice (push + pull_request).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR stops the older run; every run on main finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Lint, Typecheck, and Database rules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A plain Postgres with the Supabase migrations applied: the database security rules
    # tests and the server data-layer tests run against it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify lockfile is in sync
        run: npm ci --dry-run
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Browser diagnostic contracts
        run: node --test scripts/playwright-ci-feedback.test.mjs

      - name: Type check
        run: npm run lint:types

      - name: Test ESLint warning ratchet
        run: node --test scripts/eslint-warning-ratchet.test.mjs

      - name: Test the coverage merge of the unit shards
        run: node --test scripts/coverage-merge.test.mjs

      - name: ESLint (errors fail; warnings may not exceed --max-warnings in package.json)
        run: npm run lint:eslint

      - name: Prepare the test database (Supabase migrations)
        run: npm run db:test-setup

      - name: Database security rules tests
        run: npm run test:rules

      - name: Security audit
        run: npm audit --audit-level=high

  # The unit suite in four parallel parts (audit 22 Oct, §7.1: the single run was 14 of the 16 minutes every change
  # waited for). Each part writes its coverage; the next job merges them and applies the same thresholds.
  unit:
    name: Unit tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Prepare the test database (Supabase migrations)
        run: npm run db:test-setup

      - name: Unit tests, this part (with coverage)
        run: npm run test:shard:cov
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
          TEST_SHARD_INDEX: ${{ matrix.shard }}

      - name: Keep this part's coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}.lcov
          if-no-files-found: error
          retention-days: 3

  # One check for the whole unit suite: every part passed, and the merged coverage meets the thresholds (it only goes up).
  unit_gate:
    name: Accounting & Security Test Suites (coverage gate)
    if: always()
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every part to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: test "$UNIT_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect the coverage of the four parts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage
          merge-multiple: true

      - name: Coverage gate (all parts merged)
        run: |
          test "$(ls coverage/shard-*.lcov | wc -l)" -eq 4
          npm run coverage:gate

  # Build the exact deployable artifacts rather than relying on a separate hosting status.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0
      - name: Build production client and server
        run: npm run build
      - name: Confirm deployable artifacts exist and pass bundle invariants
        run: |
          test -s dist/index.html
          test -s build/server.cjs
          test -s build/api.cjs
          npm run test:bundle

  # The whole unit suite again in a time zone ahead of and one behind UTC, in parallel with the
  # job above (run one after the other they took the job past its time limit).
  timezones:
    name: Unit tests in ${{ matrix.tz }} (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [Pacific/Auckland, America/Los_Angeles]
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Prepare the test database (Supabase migrations)
        run: npm run db:test-setup

      - name: Unit tests, this part
        run: npm run test:shard
        env:
          TZ: ${{ matrix.tz }}
          TEST_SHARD: ${{ matrix.shard }}/3

  e2e_shards:
    name: Browser shard ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
      # The dev server started by Playwright talks to the same test database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare the test database (Supabase migrations)
        run: npm run db:test-setup

      - name: Run all browser tests across isolated shards
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/playwright-results-${{ matrix.shard }}.json
        run: |
          set +e
          npm run test:e2e -- --shard=${{ matrix.shard }}/5 --reporter=list,json,blob
          browser_exit=$?
          node scripts/playwright-ci-feedback.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME"
          exit "$browser_exit"

      - name: Upload browser reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the original required check: skipped/cancelled/failed shards cannot pass it.
  e2e:
    name: Playwright E2E Smoke Suite
    if: always()
    needs: e2e_shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - name: Download every shard report
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-shard-*
          path: playwright-reports
          merge-multiple: true
      - name: Merge browser reports
        run: npx playwright merge-reports --reporter=html playwright-reports/blob-report
      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-combined-report
          path: playwright-report/
          retention-days: 7
      - name: Require every shard to succeed
        if: always()
        env:
          SHARD_RESULT: ${{ needs.e2e_shards.result }}
        run: test "$SHARD_RESULT" = success
