name: Refresh visual baselines
# Temporary import of already-captured native candidates, only onto this Arena review branch.
# Restored byte-for-byte after retrieval/review; never creates another branch or pushes main.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Unused during temporary candidate retrieval'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  capture:
    if: github.ref == 'refs/heads/arena/d5a40f00-ledgerflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/d5a40f00-ledgerflow
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43093861738
          name: candidate-visual-baselines
          path: native-candidates
      - name: Import captured images on this review branch only
        run: |
          cp native-candidates/e2e/__screenshots__/*.png e2e/__screenshots__/
          git add e2e/__screenshots__/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'test: native Chromium visual candidates for PR 649 review'
          git push origin HEAD:arena/d5a40f00-ledgerflow
