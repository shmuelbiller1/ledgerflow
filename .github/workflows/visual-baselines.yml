name: Refresh visual baselines
# Temporary diagnostics only; restore the original workflow after collecting failure excerpts.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Unused for temporary PR649 failure diagnostics'
        required: true
permissions:
  actions: read
  pull-requests: write
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/arena/d5a40f00-ledgerflow'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish unit failure excerpts from the linked CI run
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          repo='shmuelbiller1/ledgerflow'
          jobs=[130781536615,130781536630,130781536640,130781536663,130781536793,130781536824,130781544887,130781554490]
          for job in jobs:
              details=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/jobs/{job}'],text=True))
              result=subprocess.run(['gh','run','view','43094991955','--repo',repo,'--job',str(job),'--log-failed'],capture_output=True,text=True)
              lines=result.stdout.splitlines()
              # The node spec reporter prints a final failure section; retain it plus coverage errors.
              indexes=[i for i,line in enumerate(lines) if re.search(r'failing tests:|test at |coverage.*(threshold|does not meet)|ERR_TEST|AssertionError',line,re.I)]
              selected=set()
              for i in indexes:
                  selected.update(range(max(0,i-2), min(len(lines),i+32)))
              excerpt='\n'.join(re.sub(r'^.*?\d{4}-\d\d-\d\dT[\d:.]+Z\s*','',lines[i]) for i in sorted(selected))
              if not excerpt: excerpt='\n'.join(lines[-90:]) or result.stderr
              body=f'CI diagnostic — {details["name"]} (job {job}, run 43094991955)\n\n```text\n{excerpt[:14000]}\n```'
              data=json.dumps({'body':body})
              subprocess.run(['gh','api',f'repos/{repo}/issues/649/comments','--input','-'],input=data,text=True,check=True,stdout=subprocess.DEVNULL)
          PY
