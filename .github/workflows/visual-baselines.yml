name: Refresh visual baselines
# Run by hand after a reviewed screen change: re-captures the matching reference images on the
# same Linux Chromium as CI, checks the whole set passes, and commits the images to main.
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Test-name filter, e.g. "pnl|balance-sheet"'
        required: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual-regression.spec.ts --grep "${{ inputs.screens }}" --update-snapshots --retries=0
      - run: npx playwright test e2e/visual-regression.spec.ts --retries=0
      - name: Commit the refreshed images
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          git config user.name 'Visual baselines (GitHub Actions)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/__screenshots__
          git diff --cached --quiet || { git commit -m "test: refresh visual baselines (${{ inputs.screens }})"; git pull --rebase origin main; git push origin HEAD:main; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: |
            e2e/__screenshots__/
            test-results/
          retention-days: 7
