name: Refresh visual baselines
on:
  workflow_dispatch:
    inputs:
      screens:
        description: Settings baseline review
        required: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          HUSKY: 0
      - run: node_modules/.bin/playwright install --with-deps chromium
      - name: Capture and verify the four merged Settings screens
        run: |
          node_modules/.bin/playwright test e2e/visual-regression.spec.ts --grep 'visual settings' --update-snapshots --workers=2
          node_modules/.bin/playwright test e2e/visual-regression.spec.ts --grep 'visual settings' --workers=2
      - name: Publish reviewable image blob references without creating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,glob,json,subprocess
          blobs={}
          for path in sorted(glob.glob('e2e/__screenshots__/settings-*-chromium-linux.png')):
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(open(path,'rb').read()).decode()})
              result=json.loads(subprocess.check_output(['gh','api','repos/shmuelbiller1/ledgerflow/git/blobs','--input','-'],input=payload,text=True))
              blobs[path]=result['sha']
          body='PR649 merged Settings baseline evidence '+json.dumps(blobs)
          subprocess.run(['gh','pr','comment','649','--body',body],check=True)
          PY
